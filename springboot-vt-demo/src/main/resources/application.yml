server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000

spring:
  application:
    name: vt-benchmark-springboot
  threads:
    virtual:
      enabled: false  # Set to true for virtual threads test, false for platform threads

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,threaddump,env
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: false
